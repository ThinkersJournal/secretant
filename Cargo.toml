[package]
name = "secretant"
version = "0.0.15"
edition = "2024"
description = "Placeholder: SecretAnt, secrets handling. Not yet released."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/secretant"
readme = "README.md"

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
minreq = { version = "3.0.0", features = ["https-rustls"] }
redactant = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"

[dev-dependencies]
log = "0.4.35"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }
