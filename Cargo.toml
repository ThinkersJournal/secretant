[package]
name = "secretant"
version = "0.0.34"
edition = "2024"
description = "A person's or school's own encrypted secret store: a read API for programs, a command line, and delivery to files and Cloudflare Workers."
keywords = ["secrets", "secret-store", "encryption", "vault", "cli"]
categories = ["cryptography", "command-line-utilities", "authentication"]
exclude = [".github/", "tools/", "changelog.d/", "HANDOFF.md", "ROADMAP.md", ".coderipper.toml", "deny.toml", "docs/HUMBOLDT-CHANGE-REQUEST.md", "docs/PUBLISH-0.1.0.md", "docs/PATENT-SWEEP.md"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/secretant"
readme = "README.md"
rust-version = "1.88"

[package.metadata.docs.rs]
all-features = true

[features]
# Off by default: a store consumer pulls no HTTP or TLS stack. `cloudflare` adds Cloudflare Worker secret delivery
# (`secretant::cf`, `secretant cloudflare ...`) and its HTTP client.
default = []
cloudflare = ["dep:minreq"]

[dependencies]
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage"] }
getrandom = "0.4.3"
minreq = { version = "3.0.0", features = ["https-rustls"], optional = true }
redactant = "0.1"
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zeroize = "1.9.1"

[dev-dependencies]
log = "0.4.35"
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

# The Cloudflare tests need the feature; without it the default build skips them.
[[test]]
name = "cloudflare"
required-features = ["cloudflare"]

[[test]]
name = "cloudflare_logs"
required-features = ["cloudflare"]

[[test]]
name = "place_cloudflare"
required-features = ["cloudflare"]
