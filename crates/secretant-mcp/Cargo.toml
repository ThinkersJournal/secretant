[package]
name = "secretant-mcp"
version = "0.2.4"
edition = "2024"
description = "The agent-facing face of SecretAnt: list names, read the placement ledger, verify and deliver secrets to approved files. No tool ever returns a value."
keywords = ["secrets", "mcp", "agents", "vault"]
categories = ["cryptography", "authentication"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThinkersJournal/secretant"
rust-version = "1.95"
publish = false

[features]
# Off by default: the MCP stdio server (rmcp, pinned; stdio only, no network transport). The tool layer needs none of it.
stdio = ["dep:rmcp", "dep:tokio"]
# Off by default: the Windows Hello approver, through user-request (SecretPlacement kind) with its requester identity from with-secret.
hello = ["dep:with-secret", "dep:user-request", "dep:lane-state"]

[dependencies]
secretant = { version = "0.2.4", path = "../.." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rmcp = { version = "=3.11.0", optional = true, default-features = false, features = ["server"] }
with-secret = { version = "0.17.0", optional = true, default-features = false }
user-request = { version = "0.17.0", optional = true }
lane-state = { version = "0.14.27", optional = true }
tokio = { version = "1.54.1", optional = true, features = ["rt", "macros", "io-std"] }

[dev-dependencies]
log = "0.4.35"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "io-std"] }

[[test]]
name = "hello"
required-features = ["hello"]

[[bin]]
name = "secretant-mcp"
path = "src/bin/secretant-mcp.rs"
required-features = ["stdio"]

[[test]]
name = "wire"
required-features = ["stdio"]
